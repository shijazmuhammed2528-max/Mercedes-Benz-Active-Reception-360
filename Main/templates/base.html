<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mercedes-Benz Active Reception{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <i class="fas fa-star-of-life"></i>
            </div>
            <div class="brand-text">
                <span class="brand-title">ACTIVE RECEPTION</span>
                <span class="brand-sub">360° CAPTURE SYSTEM</span>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="/capture" class="nav-item {% if request.path == '/capture' %}active{% endif %}">
                <i class="fas fa-video"></i>
                <span>Live Capture</span>
            </a>
            <a href="/upload" class="nav-item {% if request.path == '/upload' %}active{% endif %}">
                <i class="fas fa-file-upload"></i>
                <span>Image Analysis</span>
            </a>
            <a href="/database" class="nav-item {% if request.path == '/database' %}active{% endif %}">
                <i class="fas fa-database"></i>
                <span>Vehicle Database</span>
            </a>
            <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="system-badge">
                <span class="badge-dot"></span>
                <span>SYSTEM ONLINE</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
